{% extends "base.html" %}
{% block title %}הרשמה · BidStage{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <h1 class="h3 mb-3">הרשמה</h1>
    <p class="text-muted">בחרו תפקיד בעת ההרשמה. לא ניתן לשנות אותו אחר כך.</p>
    <form method="post" action="{{ url_for('auth.register_submit') }}" class="card card-body shadow-sm">
      <div class="mb-3">
        <label for="display_name" class="form-label">שם מלא</label>
        <input class="form-control" id="display_name" name="display_name" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">דוא״ל</label>
        <input class="form-control" type="email" id="email" name="email" required autocomplete="username">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">סיסמה</label>
        <input class="form-control" type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
      </div>
      <div class="mb-3">
        <label for="role" class="form-label">תפקיד</label>
        <select class="form-select" id="role" name="role" required>
          <option value="" disabled selected>בחרו תפקיד</option>
          {% for value, label in roles.items() %}
          <option value="{{ value }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <button type="submit" class="btn btn-primary">הרשמה</button>
    </form>
    <p class="mt-3">כבר רשומים? <a href="{{ url_for('auth.login') }}">כניסה</a></p>
  </div>
</div>
{% endblock %}
